          cat << 'EOF' > app/src/main/java/com/example/exynostemp/ExynosThermalReader.kt
          package com.example.exynostemp

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.PowerManager
          import rikka.shizuku.Shizuku
          import java.io.File
          import java.io.RandomAccessFile

          data class ThermalSnapshot(
              val cpuTempC: Float,
              val gpuTempC: Float,
              val batteryTempC: Float,
              val isExactHardware: Boolean
          )

          class ExynosThermalReader(private val context: Context) {

              private val powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
              private val tempLineRegex = Regex("""Temperature\{mValue=([-0-9.]+),\s*mType=([0-9]+),\s*mName=([^,\s}]+)""")
              private var lastHeadroomTime = 0L
              private var cachedHeadroom = Float.NaN

              fun isShizukuReady(): Boolean {
                  return try {
                      Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (e: Exception) {
                      false
                  }
              }

              fun readTemperatures(): ThermalSnapshot {
                  val batTemp = readBatteryTemp()

                  // 1. Try Shizuku Real Hardware Sensor Reading First
                  if (isShizukuReady()) {
                      val shizukuResult = tryReadViaShizuku(batTemp)
                      if (shizukuResult != null) return shizukuResult
                  }

                  // 2. Automatic Hybrid Fallback when Shizuku is OFF
                  val headroom = getHeadroomSafe()
                  val status = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) powerManager.currentThermalStatus else 0
                  val cpuLoadRatio = readCpuFreqLoadRatio()

                  val estCpu: Float
                  val estGpu: Float
                  if (!headroom.isNaN() && headroom > 0.05f) {
                      estCpu = (batTemp + (headroom * 26f) + (cpuLoadRatio * 5f)).coerceIn(batTemp, 95f)
                      estGpu = (batTemp + (headroom * 22f) + (cpuLoadRatio * 3.5f)).coerceIn(batTemp, 90f)
                  } else {
                      val statusBoost = status * 5.0f
                      estCpu = batTemp + 4.8f + (cpuLoadRatio * 10f) + statusBoost
                      estGpu = batTemp + 0.5f + (cpuLoadRatio * 8f) + statusBoost
                  }

                  return ThermalSnapshot(
                      cpuTempC = estCpu,
                      gpuTempC = estGpu,
                      batteryTempC = batTemp,
                      isExactHardware = false
                  )
              }

              private fun tryReadViaShizuku(batTemp: Float): ThermalSnapshot? {
                  val cpuList = mutableListOf<Float>()
                  val gpuList = mutableListOf<Float>()
                  val skinList = mutableListOf<Float>()

                  try {
                      val newProcessMethod = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      newProcessMethod.isAccessible = true

                      val cmd = arrayOf(
                          "sh", "-c",
                          "dumpsys thermalservice; echo '---SYSFS---'; " +
                          "for z in /sys/class/thermal/thermal_zone*; do " +
                          "echo \"\$(cat \$z/type 2>/dev/null)=\$(cat \$z/temp 2>/dev/null)\"; done"
                      )

                      val process = newProcessMethod.invoke(null, cmd, null, null) as Process
                      val output = process.inputStream.bufferedReader().use { it.readText() }
                      process.waitFor()
                      process.destroy()

                      var inCurrentHalSection = false
                      var inSysFsSection = false

                      for (rawLine in output.lineSequence()) {
                          val line = rawLine.trim()
                          if (line.startsWith("Current temperatures")) {
                              inCurrentHalSection = true
                              continue
                          }
                          if (line.startsWith("Current cooling") || line.startsWith("Temperature static") || line.startsWith("Thermal Status")) {
                              inCurrentHalSection = false
                          }
                          if (line == "---SYSFS---") {
                              inCurrentHalSection = false
                              inSysFsSection = true
                              continue
                          }

                          if (inCurrentHalSection && line.startsWith("Temperature{")) {
                              val match = tempLineRegex.find(line)
                              if (match != null) {
                                  val rawVal = match.groupValues[1].toFloatOrNull() ?: continue
                                  val type = match.groupValues[2].toIntOrNull() ?: -1
                                  val name = match.groupValues[3].uppercase()
                                  val tempC = if (rawVal > 1000f) rawVal / 1000f else rawVal

                                  if (tempC in 15f..115f) {
                                      when {
                                          type == 0 || name.contains("BIG") || name.contains("MID") || name.contains("LITTLE") || name.contains("CPU") -> cpuList.add(tempC)
                                          type == 1 || name.contains("G3D") || name.contains("GPU") -> gpuList.add(tempC)
                                          type == 3 || name.contains("SKIN") || name.contains("SOC") || name.contains("AP") -> skinList.add(tempC)
                                      }
                                  }
                              }
                          } else if (inSysFsSection && line.contains("=")) {
                              val parts = line.split("=", limit = 2)
                              val name = parts[0].uppercase()
                              val rawVal = parts[1].toFloatOrNull() ?: continue
                              val tempC = if (rawVal > 1000f) rawVal / 1000f else rawVal

                              if (tempC in 15f..115f) {
                                  when {
                                      name.contains("BIG") || name.contains("MID") || name.contains("LITTLE") || name.contains("CPU") -> cpuList.add(tempC)
                                      name.contains("G3D") || name.contains("GPU") -> gpuList.add(tempC)
                                      name.contains("SOC") || name.contains("AP") || name.contains("SEC_THERM") -> skinList.add(tempC)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {
                      return null
                  }

                  val finalCpu = cpuList.maxOrNull() ?: skinList.maxOrNull()
                  val finalGpu = gpuList.maxOrNull() ?: skinList.maxOrNull()

                  return if (finalCpu != null && finalGpu != null) {
                      ThermalSnapshot(finalCpu, finalGpu, batTemp, true)
                  } else null
              }

              private fun readCpuFreqLoadRatio(): Float {
                  var totalRatio = 0f
                  var readableCores = 0
                  for (i in 0..9) {
                      try {
                          val curFile = File("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq")
                          val maxFile = File("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_max_freq")
                          if (curFile.canRead() && maxFile.canRead()) {
                              val cur = RandomAccessFile(curFile, "r").use { it.readLine()?.trim()?.toFloatOrNull() }
                              val max = RandomAccessFile(maxFile, "r").use { it.readLine()?.trim()?.toFloatOrNull() }
                              if (cur != null && max != null && max > 0f) {
                                  totalRatio += (cur / max)
                                  readableCores++
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return if (readableCores > 0) (totalRatio / readableCores).coerceIn(0.1f, 1.0f) else 0.25f
              }

              private fun getHeadroomSafe(): Float {
                  val now = System.currentTimeMillis()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && (now - lastHeadroomTime > 11_000L)) {
                      lastHeadroomTime = now
                      val hr = powerManager.getThermalHeadroom(0)
                      if (!hr.isNaN() && hr > 0f) cachedHeadroom = hr
                  }
                  return cachedHeadroom
              }

              private fun readBatteryTemp(): Float {
                  val intent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val rawTemp = intent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
                  return rawTemp / 10f
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/exynostemp/ThermalOverlayService.kt
          package com.example.exynostemp

          import android.app.*
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.IBinder
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.view.*
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import java.util.Locale

          class ThermalOverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var overlayTextView: TextView
              private lateinit var thermalReader: ExynosThermalReader
              private val serviceScope = CoroutineScope(Dispatchers.Default + SupervisorJob())
              private var pollingJob: Job? = null

              private val colorNormal = Color.parseColor("#00FFCC") // Cool Cyan
              private val colorHot = Color.parseColor("#FF3B30")    // Warning Red
              private val colorDivider = Color.parseColor("#CCCCCC")

              private val screenStateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> stopPolling()
                          Intent.ACTION_SCREEN_ON -> startPolling()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  thermalReader = ExynosThermalReader(this)
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  startMinimalForegroundNotification()
                  setupFloatingOverlay()

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_SCREEN_ON)
                  }
                  ContextCompat.registerReceiver(this, screenStateReceiver, filter, ContextCompat.RECEIVER_EXPORTED)
                  startPolling()
              }

              private fun setupFloatingOverlay() {
                  overlayTextView = TextView(this).apply {
                      setTextColor(colorNormal)
                      textSize = 12f
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                      setBackgroundColor(Color.TRANSPARENT)
                      setShadowLayer(6f, 2f, 2f, Color.BLACK)
                      setPadding(12, 6, 12, 6)
                      text = "Reading S24FE..."
                  }

                  val layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 120
                  }

                  overlayTextView.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = layoutParams.x
                                  initialY = layoutParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  layoutParams.x = initialX + (event.rawX - initialTouchX).toInt()
                                  layoutParams.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(overlayTextView, layoutParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })
                  windowManager.addView(overlayTextView, layoutParams)
              }

              private fun startPolling() {
                  if (pollingJob?.isActive == true) return
                  pollingJob = serviceScope.launch {
                      while (isActive) {
                          val snap = thermalReader.readTemperatures()
                          val styledText = buildColoredDisplayText(snap)
                          withContext(Dispatchers.Main) { overlayTextView.text = styledText }
                          delay(3000L)
                      }
                  }
              }

              private fun stopPolling() {
                  pollingJob?.cancel()
                  pollingJob = null
              }

              private fun buildColoredDisplayText(snap: ThermalSnapshot): CharSequence {
                  val builder = SpannableStringBuilder()
                  val prefix = if (snap.isExactHardware) "" else "~"

                  val cpuText = String.format(Locale.US, "CPU: %s%.1f°C", prefix, snap.cpuTempC)
                  val gpuText = String.format(Locale.US, "GPU: %s%.1f°C", prefix, snap.gpuTempC)
                  val batText = String.format(Locale.US, "Bat: %.1f°C", snap.batteryTempC)

                  // Thresholds requested: CPU >= 65°C, GPU >= 60°C, Battery >= 40°C
                  val cpuColor = if (snap.cpuTempC >= 65.0f) colorHot else colorNormal
                  val gpuColor = if (snap.gpuTempC >= 60.0f) colorHot else colorNormal
                  val batColor = if (snap.batteryTempC >= 40.0f) colorHot else colorNormal

                  appendColored(builder, cpuText, cpuColor)
                  appendColored(builder, " | ", colorDivider)
                  appendColored(builder, gpuText, gpuColor)
                  appendColored(builder, " | ", colorDivider)
                  appendColored(builder, batText, batColor)

                  return builder
              }

              private fun appendColored(builder: SpannableStringBuilder, text: String, color: Int) {
                  val start = builder.length
                  builder.append(text)
                  builder.setSpan(ForegroundColorSpan(color), start, builder.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
              }

              private fun startMinimalForegroundNotification() {
                  val channelId = "thermal_overlay_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Thermal Overlay", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("S24FE Thermal Monitor")
                      .setContentText("Hybrid overlay active (0% idle drain)")
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, notification)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopPolling()
                  serviceScope.cancel()
                  unregisterReceiver(screenStateReceiver)
                  if (::overlayTextView.isInitialized) windowManager.removeView(overlayTextView)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/exynostemp/MainActivity.kt
          package com.example.exynostemp

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView

              private val permissionListener = Shizuku.OnRequestPermissionResultListener { _, grantResult ->
                  updateShizukuStatus()
                  if (grantResult == PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Shizuku Authorized! Real sensors unlocked.", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permissionListener)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                  }

                  statusText = TextView(this).apply {
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 48)
                  }

                  val shizukuBtn = Button(this).apply {
                      text = "1. Grant Shizuku (Optional for Exact Sensors)"
                      setOnClickListener { requestShizuku() }
                  }

                  val startBtn = Button(this).apply {
                      text = "2. Start Thermal Overlay"
                      setOnClickListener { checkPermissionAndStart() }
                  }

                  val stopBtn = Button(this).apply {
                      text = "Stop Thermal Overlay"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, ThermalOverlayService::class.java))
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(shizukuBtn)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
                  updateShizukuStatus()
              }

              override fun onResume() {
                  super.onResume()
                  updateShizukuStatus()
              }

              private fun updateShizukuStatus() {
                  val status = try {
                      if (!Shizuku.pingBinder()) {
                          "Mode: Hybrid Estimation (~CPU/~GPU)\n(Start Shizuku anytime for 100% exact die sensors)"
                      } else if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                          "Mode: Exact Hardware Sensors (Shizuku Active)\nRed Alerts: CPU ≥ 65°C | GPU ≥ 60°C | Bat ≥ 40°C"
                      } else {
                          "Shizuku detected! Tap button 1 to unlock exact sensors."
                      }
                  } catch (e: Exception) {
                      "Mode: Hybrid Estimation (~CPU/~GPU)"
                  }
                  statusText.text = status
              }

              private fun requestShizuku() {
                  try {
                      if (!Shizuku.pingBinder()) {
                          Toast.makeText(this, "Shizuku isn't running—using Hybrid Estimation mode!", Toast.LENGTH_LONG).show()
                          return
                      }
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(1001)
                      } else {
                          Toast.makeText(this, "Already authorized!", Toast.LENGTH_SHORT).show()
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Shizuku not active", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun checkPermissionAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Grant 'Appear on top' permission first", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  } else {
                      val serviceIntent = Intent(this, ThermalOverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      finish()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  Shizuku.removeRequestPermissionResultListener(permissionListener)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24FE-Hybrid-v4-Thermal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
